[project]
name = "naza-o-level-tutor"
version = "0.1.0"
description = "Offline ADTC 2026 O-Level AI tutor: local Gemma-4 + FAISS RAG"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.52,<1",
    "python-dotenv>=1.0",
    "pydantic>=2.10",
    "numpy>=2.0",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.0",
    "torch>=2.2",
    "llama-cpp-python==0.3.34",
    "pymupdf>=1.24",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.uv]
package = false

# CPU torch wheels (the app is CPU-only llama.cpp + SentenceTransformer).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
